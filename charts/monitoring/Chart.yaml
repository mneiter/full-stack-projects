apiVersion: v2
name: monitoring
description: A Helm chart to deploy Prometheus and Grafana for monitoring
type: application
version: 0.1.0
appVersion: "1.0"

dependencies:
  - name: prometheus
    version: 25.21.0
    repository: https://prometheus-community.github.io/helm-charts

  - name: grafana
    version: 7.3.9
    repository: https://grafana.github.io/helm-charts
