apiVersion: v1
kind: Pod
metadata:
  name: '{{ .Release.Name }}-test-frontend'
  annotations:
    'helm.sh/hook': test
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.2.1
      command: ['curl']
      args:
        [
          '--fail',
          'http://{{ .Values.frontend.fullnameOverride }}:{{ .Values.frontend.containerPort }}',
        ]
