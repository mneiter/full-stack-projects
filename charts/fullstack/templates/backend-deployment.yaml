apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          imagePullPolicy: Never
          ports:
            - containerPort: {{ .Values.backend.containerPort }}
          env:
            - name: APP_ROOT_PATH
              value: '/api'
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "fullstack.fullname" . }}-secret
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "fullstack.fullname" . }}-secret
                  key: JWT_SECRET
          command:
            - uvicorn
            - app.main:app
            - --host
            - '0.0.0.0'
            - --port
            - '{{ .Values.backend.containerPort }}'
            - --reload
