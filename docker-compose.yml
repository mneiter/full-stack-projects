services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: fastapi-backend
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules # предотвращает конфликт локальных зависимостей
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development

  mongo:
    image: mongo:6
    ports:
      - '27017:27017'
