apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fullstack-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-username/full-stack-projects
    targetRevision: main
    path: charts/fullstack
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
