apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fullstack-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mneiter/full-stack-projects.git
    targetRevision: main
    path: charts/fullstack
    helm:
      releaseName: fullstack-prod
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true