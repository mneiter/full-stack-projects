apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fullstack-general
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mneiter/full-stack-projects.git
    targetRevision: KubernetesArgo
    path: charts/fullstack
    helm:
      releaseName: fullstack-general
      valueFiles:
        - values.yaml
        - values-general.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true